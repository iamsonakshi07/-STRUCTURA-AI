

databases:
  - name: structura-postgres
    databaseName: structura_ai
    user: structura_user
    plan: free

services:
  # ----------------------------------------------------------------------------
  # FastAPI REST API & WebSocket Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: structura-backend
    runtime: python
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: structura-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEMO_MODE
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://structura-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.10"
