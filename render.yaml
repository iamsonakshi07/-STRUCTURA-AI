
version: "1"

databases:
  - name: structura-postgres
    databaseName: structura_ai
    user: structura_user
    plan: free

services:
  - type: web
    name: structura-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: structura-postgres
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: DEMO_MODE
        value: "true"

      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000"]'

      - key: PYTHON_VERSION
        value: "3.11.10"
