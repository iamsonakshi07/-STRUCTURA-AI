# =================================================================
# A generic, single database configuration for Alembic.
# =================================================================

[alembic]
# Path to migration scripts
script_location = backend/alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with project root
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py file to be detected
sourceless = false

# Version location specification; This defaults to backend/alembic/versions.
version_locations = %(here)s/backend/alembic/versions

# Version path separator.
version_path_separator = :

# Fallback SQLAlchemy URL (Overridden dynamically in env.py from backend.app.core.config.settings)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/structura_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
